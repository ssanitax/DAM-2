<!DOCTYPE html>
<html lang="es">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   ssanitax · acceso
  </title>
  <link href="favicon.svg" rel="shortcut icon" type="image/svg+xml"/>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;700&display=swap" rel="stylesheet"/>
  <link href="css/estilo.css?v=21" rel="stylesheet"/>
 </head>
 <body class="ju-acceso-page">
  <main class="ju-acceso acceso-ficha">
   <article class="hoja">
    <div class="acceso-logo">
     <span aria-hidden="true" class="marca-signo"></span>
     <div>
      <h1>
       ssanitax
      </h1>
      <p>
       panel
      </p>
     </div>
    </div>
    <h2>
     Iniciar sesión
    </h2>
    <p class="acceso-ayuda">
     Introduce tus credenciales.
    </p>
    <form action="index.html" class="ju-form-grid" target="_top">
     <label class="ju-form-full">
      <span>
       Email
      </span>
      <input autocomplete="username" placeholder="nombre@ejemplo.com" required="" type="email"/>
     </label>
     <label class="ju-form-full">
      <span>
       Contraseña
      </span>
      <input autocomplete="current-password" placeholder="••••••••" required="" type="password"/>
     </label>
     <label class="ju-check ju-form-full">
      <input type="checkbox"/>
      <span>
       Mantener la sesión
      </span>
     </label>
     <div class="ju-form-full acceso-enviar">
      <button class="ju-btn" type="submit">
       Entrar
      </button>
      <a class="ju-text-link" href="#">
       ¿Olvidaste la contraseña?
      </a>
     </div>
    </form>
   </article>
  </main>
 </body>
</html>
